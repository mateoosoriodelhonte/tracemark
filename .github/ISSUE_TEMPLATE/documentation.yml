name: Documentation improvement
description: Report unclear, missing, or inaccurate TraceMark documentation
title: '[Docs]: '
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use a synthetic example. Do not include private research, backup contents, browser-profile paths, credentials, or vulnerability details.
  - type: input
    id: location
    attributes:
      label: Page or section
      description: Link to the page and, if helpful, name its heading.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or inaccurate?
      description: Describe the reader goal and the point where the documentation fails to help.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested clarification
      description: Optional wording, example, or link that would resolve the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation first.
          required: true
        - label: This report contains no sensitive research or security details.
          required: true
